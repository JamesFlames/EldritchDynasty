# Traits are the extensibility surface. Each declares its own influence in two
# flavours: PRESENCE (it exists, in some scope) and DISPATCH (it was chosen for
# a mission). Adding "the family employs a competent midwife and fewer infants
# die" is a content edit, not an engine change. That is the entire point.
traits:
  - id: reads_the_signs
    name: Reads the Signs
    tags: [retainer, knowledge, women]
    acquisition: { kind: assigned }
    description: >-
      She can tell what a girl is carrying by how the room behaves around her.
      Every house has a folk theory about the signs and every theory disagrees;
      hers happens to be right more often than not.
    presence:
      - scope: household
        modifiers:
          - { kind: reveal_signs, power: 0.7 }
          - { kind: event_weight, match: { tags: [birth] }, multiply: 1.4 }

  - id: competent_physician
    name: A Competent Physician
    tags: [retainer, medicine]
    acquisition: { kind: assigned }
    description: >-
      The most interesting presence effects are the ones where nothing happens.
      She does not add a bonus to the plague; she removes a branch of it. The
      family learns what she was worth when she dies.
    presence:
      - scope: household
        modifiers:
          - { kind: suppress, match: { tags: [infant_death] } }
          - { kind: event_weight, match: { tags: [plague] }, multiply: 0.55 }

  - id: the_tutors_aphorisms
    name: The Tutor's Aphorisms
    tags: [tutor, warmth]
    acquisition: { kind: assigned }
    description: >-
      His lines become the family's aphorisms, quoted in the chronicle for
      centuries by people who never met him.
    presence:
      - scope: household
        modifiers:
          - { kind: attribute, attr: mind, delta: 3, target: children }
          - { kind: event_weight, match: { tags: [study] }, multiply: 1.5 }

  - id: sign_of_the_blood
    name: Sign of the Blood
    tags: [omen, hidden]
    acquisition: { kind: sign, perFontPoint: 0.018 }
    description: >-
      Iron that dulls where she has slept. Milk that turns sweet. Unreliable,
      cheap, everywhere — and every marriage-broker in the province has an
      opinion about it.

  - id: early_waking
    name: Early Waking
    tags: [omen, honest_signal]
    acquisition: { kind: assigned }
    description: >-
      She woke at nine, in front of witnesses. The one signal in a marriage
      market otherwise built entirely on forged documents: unfakeable, publicly
      seen, and worth more than any notarised pedigree.
    presence:
      - scope: house
        modifiers:
          - { kind: event_weight, match: { tags: [marriage, suitor] }, multiply: 1.8 }

  - id: hard_hands
    name: Hard Hands
    tags: [soldier, dispatch]
    acquisition: { kind: threshold, attr: strength, atLeast: 55 }
    dispatch:
      - whenCastAs: [family_member, head]
        modifiers:
          - { kind: check_bonus, match: { tags: [violence] }, delta: 12 }

  - id: bought_grandmother
    name: A Bought Grandmother
    tags: [pedigree, forgery]
    acquisition: { kind: assigned }
    description: >-
      Three generations of maternal records, notarised, and every page of it
      purchased. The documents are a forgery-prone substitute for the one proof
      that actually exists, which is what her sons turn out to be.
    presence:
      - scope: house
        modifiers:
          - { kind: event_weight, match: { tags: [scandal, pedigree] }, multiply: 1.6 }

  - id: keeps_a_night_watch
    name: Keeps a Night Watch
    tags: [retainer, soldier, vigilance]
    acquisition: { kind: assigned }
    description: >-
      Somebody is awake in this house at every hour that matters, in a
      rotation nobody wrote down and everybody still keeps. Three generations
      of trouble on the river road have found the gate already barred.
    presence:
      - scope: household
        modifiers:
          - { kind: unlock, grants: gate_watch }
          - { kind: outcome_weight, match: { tags: [vigilance] }, multiply: 1.8 }

  - id: hardened_by_the_line
    name: Hardened by the Line
    tags: [soldier, career]
    acquisition: { kind: career, career: military, afterYears: 10 }
    description: >-
      Ten years in a commission bought, not earned, and it stops mattering how
      it was bought. What is left is a man who does not flinch at the things
      that make other men flinch.
    dispatch:
      - whenCastAs: [family_member, head]
        modifiers:
          - { kind: check_bonus, match: { tags: [violence] }, delta: 8 }

  - id: keeps_the_tollgate
    name: Keeps the Tollgate
    tags: [retainer, trade]
    acquisition: { kind: assigned }
    description: >-
      A plank bridge, a chain, and a rate nobody has argued down in forty
      years. It is not much, set against the treasury. It is never nothing.
    presence:
      - scope: household
        modifiers:
          - { kind: resource, resource: toll, perYear: 4 }

  # ── The three posts the game declared and never hired for ───────────────
  # `RetainerRoleS` has always listed eight roles. Five were filled by a
  # template; `physician`, `singer` and `chronicler` were names in a union with
  # nothing behind them, which is the failure mode this repo is named after.
  # Each of the three now arrives with a presence effect and an `unlock`, and
  # the unlock is what gives the events below something to gate on.
  - id: keeps_the_sickroom
    name: Keeps the Sickroom
    tags: [retainer, medicine, vigilance]
    acquisition: { kind: assigned }
    description: >-
      Boiled linen, a window opened at the hour she says and not before, and a
      rule about who may be in the room that she enforces against the Head
      himself. None of it is understood by anybody, including her. All of it
      works, and the house cannot say by how much, because what it buys is a
      list of years in which nothing happened.
    presence:
      # The unlock and the health, and DELIBERATELY nothing about the plague.
      # `competent_physician` already multiplies plague weight by 0.55 and the
      # physician's template carries both traits, so a second 0.7 here stacked
      # to 0.385 — and a house with a physician in post stopped seeing the
      # Plague's own content at all. `who_gets_the_physician` went from 2% of
      # runs to never. A trait that suppresses the Age it exists for is a
      # trait that deletes the scene it was written to be in.
      - scope: household
        modifiers:
          - { kind: unlock, grants: sickroom }
          - { kind: suppress, match: { tags: [infant_death] } }
          - { kind: attribute, attr: health, delta: 2, target: household }

  - id: keeps_the_house_songs
    name: Keeps the House Songs
    tags: [retainer, folklore, warmth]
    acquisition: { kind: assigned }
    description: >-
      Eleven staves nobody else has, and the turn of each one held back until
      the room is full enough to finish it. What the house is paying for is not
      the singing. It is that the version sung at Ardwen is the version the
      Wayfolk carry out of Ardwen, and a house that lets a stranger set the
      tune has already lost the argument about what happened.
    presence:
      - scope: house
        modifiers:
          - { kind: unlock, grants: house_songs }
          - { kind: event_weight, match: { tags: [folklore, feast] }, multiply: 1.5 }
          - { kind: outcome_weight, match: { tags: [reputation] }, multiply: 1.4 }

  - id: keeps_a_fair_hand
    name: Keeps a Fair Hand
    tags: [retainer, records, literacy]
    acquisition: { kind: assigned }
    description: >-
      A clerk's hand, ruled lines, dates in the margin, and an entry made the
      same week the thing happened rather than forty years later by a man
      remembering. The Warden's clerk accepts his copies without a second
      reading, which is worth more at the assize than any oath the house can
      swear.
    presence:
      - scope: household
        modifiers:
          - { kind: unlock, grants: fair_hand }
          - { kind: event_weight, match: { tags: [records, law] }, multiply: 1.4 }
          - { kind: attribute, attr: mind, delta: 1, target: children }

  # The fourth of the posts to get an unlock, and the one that was already
  # hired. The archive was addressable by nothing: a `retainer` slot casts
  # whoever is in the house wearing a contract, and there is no filter for
  # which contract. A trait is how a post becomes a person an event can name.
  - id: keeps_the_house_archive
    name: Keeps the House Archive
    tags: [retainer, records, knowledge]
    acquisition: { kind: assigned }
    description: >-
      Eleven quires of index, in one hand, covering four hundred years of a
      house that has never once thrown anything away. She did not write most of
      what is in the presses. She wrote where all of it is, which turns out to
      be the more valuable document and the harder one to keep.
    presence:
      - scope: household
        modifiers:
          - { kind: unlock, grants: house_archive }
          - { kind: event_weight, match: { tags: [records, library] }, multiply: 1.35 }

