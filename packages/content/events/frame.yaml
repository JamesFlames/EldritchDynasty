# THE FRAME (concept §2, Layer 1; issue #13).
#
# Year 2042. Two at a long table: the current blood, whoever that is this
# telling, and the guardian, who is not a person and has not been for a very
# long time. The frame never dispenses systems information — no numbers, no
# names of mechanics, nothing the household would recognise as an event. It
# reacts to what the family's own record now says, gated by `reads` rather
# than `conditions`.
#
# Both slots are cast the same way every time — `LISTENER_A` the current head
# (the last of the blood; may be a woman in a Regency), `LISTENER_B` the
# guardian — so most of the specificity here lives in what each interlude
# reacts to, not in who is sitting there. Pronouns stay off `LISTENER_A` for
# exactly that reason.
events:
  - id: frame_the_seal_still_west
    title: A Box in Someone Else's Hallway
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, seal]
    purposes: [advance_clause, buy_patience, change_standing]
    reads:
      - { discrepancy: seal_gift_lie, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Two of the seven grates are lit tonight, which is one more than usual.
      The guardian has not mentioned the Seal in eleven tellings and does not
      mention it now.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Somebody, a very long time ago, called it a loan. Nobody has corrected that since.

  - id: frame_what_the_ledger_says_of_the_seal
    title: A Trusted Branch
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, seal]
    purposes: [advance_clause, buy_patience, change_standing]
    reads:
      - { discrepancy: seal_keeping_lie, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The page says the Seal never left the house, kept by a trusted branch,
      and the guardian was in the room the day that sentence was chosen over
      the true one. He does not say which branch. There has never been one.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: The last of the blood reads it twice, the second time slower, and does not ask.

  - id: frame_two_of_three
    title: The Third Piece
    tier: frame
    frequency: rare
    weight: 110
    repeatable: false
    cooldownYears: 0
    tags: [frame, regalia]
    purposes: [worldbuild_through_action, change_standing, advance_clause]
    # NO `state`, for the reason given on the three interludes above. What
    # this one reads is what the RECORD says, and a chronicle entry does not
    # change its wording when somebody proves it wrong — the record still
    # says entire, which is the whole of this interlude's first line.
    reads:
      - { discrepancy: regalia_lie }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The record says entire. The guardian counts on fingers that are not
      fingers, out of a habit that outlived the hand. He gets to two, the way
      he always gets to two, and stops there, the way he always stops there.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Whatever the rite was for, it is still owed.

  - id: frame_the_cost_not_written
    title: What the Book Did Not Say
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, drowning]
    purposes: [worldbuild_through_action, change_relationship, advance_clause]
    # NO `state` — see `frame_the_missing_third_returns` below, and
    # `FrameReadS`'s own note. An interlude waiting on one particular lie in
    # one particular state is an interlude most runs never see, and these
    # three all wait on the same one: the Drowning's Embellish, or the Seal's.
    # When the ambient rare pool went from nine templates to fifty-nine, the
    # templates those lies come from thinned with everything else in the tier
    # and all three of these went to zero across the sixty-seed coverage
    # batch. The premise is that the lie was told. It does not stop being
    # true when somebody proves it — that is when the guardian's line lands
    # hardest.
    reads:
      - { discrepancy: the_drowning_lie }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Somewhere in the house a trough was filled and emptied a hundred years
      ago and the ledger calls it a kindness. The guardian was cold on the
      night it happened. He is not cold now, because cold is a thing bodies do.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: The last of the blood asks, once, whether it hurt. He answers a different question instead.

