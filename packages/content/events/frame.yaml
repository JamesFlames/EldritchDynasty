      - { discrepancy: the_thin_papers, state: buried }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      A fine, a small confessed heresy, a great deal of tea gone cold, and the
      house bought eighty years of nobody asking further. The guardian thinks
      that was cheap. He has never once said so where the ledger could hear him.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: The last of the blood does the sum anyway, and it comes out cheap too.

  # ── Returning beats: the same lie, still sitting on the table ────────────

  - id: frame_the_west_house_again
    title: Still Not Corrected
    tier: frame
    frequency: rare
    weight: 80
    repeatable: true
    cooldownYears: 75
