    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      It happened again, two hundred years apart and identical in every
      particular that matters, and the second page is even shorter than the
      first. The guardian turns to it without being asked where it is.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Some debts are paid twice because the first receipt was thrown away on purpose.

  - id: frame_nine_libraries
    title: What Burned, and What Was Kept
    tier: frame
