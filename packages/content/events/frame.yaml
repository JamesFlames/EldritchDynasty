    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Somebody else's ledger, decades later, said more about 1341 than the
      house's own did, and said it to men with the authority to keep saying
      it. The guardian has known since the tea went cold that day which page would win.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Being caught short costs more than telling the truth would have. It always does.

  - id: frame_the_bought_silence
    title: Eighty Years of Not Being Looked At
    tier: frame
    frequency: rare
    weight: 90
    repeatable: false
    cooldownYears: 0
    tags: [frame, church]
    purposes: [advance_clause, buy_patience, worldbuild_through_action]
