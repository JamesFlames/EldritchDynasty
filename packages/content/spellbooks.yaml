# THE LIBRARY (concept §12). A spellbook is bought once and pays out for
# centuries — the physical copy persists on the house's shelf
# (`WorldState.library`) independent of who has actually studied it
# (`Person.spellsKnown`). Mystic magic is Madness-free: nothing that studies
# from these ever touches `madness` or `eldritch`.
#
# `canLearn` (invariant 4) is the whole of the restriction: women study only
# the four Threshold affinities (life, death, light, darkness); men study all
# eight. Minor spellbook 60-200 crowns; foreign or high-tier 400-1,200
# (concept §13) — the auction's stock is mostly these.
spellbooks:
  - id: lesser_workings_of_fluid
    name: Lesser Workings of Fluid
    affinity: fluid
    tier: minor
    studyYears: 2
    degradesBy: 20
    price: { min: 60, max: 150 }
    blurb: A shipwright's primer, mostly. Calms water that does not want to be calm.

  - id: lesser_workings_of_thermal
    name: Lesser Workings of Thermal
    affinity: thermal
    tier: minor
    studyYears: 2
    degradesBy: 20
    price: { min: 60, max: 150 }
    blurb: How to keep a hearth lit through a siege, and how to put one out from across a room.

  - id: lesser_workings_of_aero
    name: Lesser Workings of Aero
    affinity: aero
    tier: minor
    studyYears: 2
    degradesBy: 20
    price: { min: 70, max: 160 }
    blurb: A sailor's book, quietly more useful to an archer.

  - id: lesser_workings_of_terra
    name: Lesser Workings of Terra
    affinity: terra
    tier: minor
    studyYears: 3
    degradesBy: 15
    price: { min: 80, max: 180 }
    blurb: Foundations that do not settle, and a way of knowing what is buried before you dig for it.

  - id: lesser_workings_of_life
    name: Lesser Workings of Life
    affinity: life
    tier: minor
    studyYears: 2
    degradesBy: 20
    price: { min: 90, max: 200 }
    blurb: A midwife's marginalia, copied so many times the copies have their own errors.

  - id: lesser_workings_of_death
    name: Lesser Workings of Death
    affinity: death
    tier: minor
    studyYears: 2
    degradesBy: 20
    price: { min: 90, max: 200 }
    blurb: How to tell a body what year it is, and have it believe you a while longer.

  - id: lesser_workings_of_light
    name: Lesser Workings of Light
    affinity: light
    tier: minor
    studyYears: 2
    degradesBy: 25
    price: { min: 90, max: 200 }
    blurb: The Church printed these by the hundred and burns every copy it finds outside its own libraries.

  - id: lesser_workings_of_darkness
    name: Lesser Workings of Darkness
    affinity: darkness
    tier: minor
    studyYears: 2
    degradesBy: 25
    price: { min: 90, max: 200 }
    blurb: Unmarked binding, on purpose. Nobody who owns one wants it recognised on a shelf.

  - id: the_marrow_codex
    name: The Marrow Codex
    affinity: death
    tier: foreign
    studyYears: 6
    degradesBy: 12
    threshold: 20
    price: { min: 500, max: 1100 }
    blurb: >-
      House Marrow's own working, copied at enormous cost and never with their
      blessing. They always want it back, and always bid on it first.

  - id: the_ilm_lightbook
    name: The Ilm Lightbook
    affinity: light
    tier: foreign
    studyYears: 5
    degradesBy: 15
    threshold: 15
    price: { min: 400, max: 900 }
    blurb: Scholars' light, footnoted three generations deep. The Church bids on it and burns what it wins.

  - id: the_first_working
    name: The First Working
    affinity: life
    tier: named
    studyYears: 4
    degradesBy: 10
    threshold: 35
    price: { min: 700, max: 1200 }
    blurb: >-
      Named for whoever in this house first sets it down correctly. Everyone
      after her only ever adds a footnote.

  # ── NOTABLE ──────────────────────────────────────────────────────────────
  # `SpellbookTierS` has declared four tiers since it was written and content
  # named three: eight minor, two foreign, one named, and nothing whatever in
  # between. A library with a floor and a ceiling and no staircase is a library
  # where the only decision is whether you are rich yet.
  #
  # A Greater Working is four years instead of two, two to four hundred crowns
  # instead of sixty to a hundred and fifty, and — the part that matters —
  # carries a `threshold`, so buying one is a bet on somebody's blood rather
  # than on the treasury. The minor books have no threshold at all. This is the
  # first rung where the house can buy a book nobody in it can read.
  - id: greater_workings_of_fluid
    name: Greater Workings of Fluid
    affinity: fluid
    tier: notable
    studyYears: 4
    degradesBy: 16
    threshold: 12
    price: { min: 200, max: 400 }
    blurb: >-
      Written by a man who drained forty miles of the Lag for a Warden who did
      not pay him. Half of it is bitter and all of it is correct.

  - id: greater_workings_of_thermal
    name: Greater Workings of Thermal
    affinity: thermal
    tier: notable
    studyYears: 4
    degradesBy: 18
    threshold: 12
    price: { min: 220, max: 430 }
    blurb: >-
      The siege book. Three chapters on keeping men alive in a winter and one,
      at the back, that the Church has asked twice to see and been refused.

  - id: greater_workings_of_aero
    name: Greater Workings of Aero
    affinity: aero
    tier: notable
    studyYears: 4
    degradesBy: 22
    threshold: 14
    price: { min: 210, max: 390 }
    blurb: >-
      Mostly about ships and entirely about weather, by a Sarrow pilot who
      never once claims to have changed any, and whose sailing times say he did.

  - id: greater_workings_of_terra
    name: Greater Workings of Terra
    affinity: terra
    tier: notable
    studyYears: 4
    degradesBy: 12
    threshold: 12
    price: { min: 240, max: 450 }
    blurb: >-
      Quarry work out of Hesk, in a dialect two of the Colleges refuse to
      examine in. Every roof in the province is downstream of about nine pages.

  - id: greater_workings_of_life
    name: Greater Workings of Life
    affinity: life
    tier: notable
    studyYears: 5
    degradesBy: 14
    threshold: 16
    price: { min: 300, max: 480 }
    blurb: >-
      The book a house buys in a plague and reads for the next two hundred
      years. Women may study it, which is why there are so few clean copies.

  - id: greater_workings_of_death
    name: Greater Workings of Death
    affinity: death
    tier: notable
    studyYears: 5
    degradesBy: 14
    threshold: 16
    price: { min: 280, max: 460 }
    blurb: >-
      Legal to own, legal to study, and ruinous to be seen carrying in a
      Crusade. Marrow bids on every copy and does not always want to read them.

  - id: greater_workings_of_light
    name: Greater Workings of Light
    affinity: light
    tier: notable
    studyYears: 4
    degradesBy: 15
    threshold: 14
    price: { min: 260, max: 440 }
    blurb: >-
      Safe in every Age, which is the whole of its reputation and about half of
      its value. The Church has never objected to a page of it in four hundred years.

  - id: greater_workings_of_darkness
    name: Greater Workings of Darkness
    affinity: darkness
    tier: notable
    studyYears: 5
    degradesBy: 20
    threshold: 18
    price: { min: 290, max: 470 }
    blurb: >-
      Nothing in it is a crime and everything in it is an accusation. Houses
      buy this one through a factor and shelve it behind something else.

  # ── Two more at the top of the market ────────────────────────────────────
  - id: the_braccish_weight_book
    name: The Braccish Weight Book
    affinity: terra
    tier: foreign
    studyYears: 6
    degradesBy: 8
    threshold: 22
    price: { min: 450, max: 950 }
    blurb: >-
      A counting house's working, in a counting house's hand, about the one
      thing Bracc has never let anybody else adjudicate. Bound in boards that
      have outlasted two of the families that owned it.

  - id: the_drowned_calendar
    name: The Drowned Calendar
    affinity: fluid
    tier: named
    studyYears: 7
    degradesBy: 6
    threshold: 30
    price: { min: 800, max: 1200 }
    blurb: >-
      Named for the woman of this house who first gets the tide tables of the
      Lag right, and useless to anybody who has not stood in that water. Every
      hand after hers is a correction to a correction.
