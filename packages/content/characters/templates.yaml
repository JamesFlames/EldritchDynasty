  - id: suitor_burgess_daughter
    title: A Burgess's Daughter of Bramme
    role: suitor
    frequency: common
    weight: 110
    sex: female
    ageAtArrival: { min: 16, max: 25 }
    bias: { mind: 0.4, charm: 0.3 }
    houses: [{ house: commons, weight: 60 }, { house: house_bracc, weight: 60 }]
