  - id: suitor_of_the_fell
    title: A Grazier's Daughter
    role: suitor
    frequency: common
    weight: 100
    sex: female
    ageAtArrival: { min: 17, max: 28 }
    bias: { strength: 0.3, longevity: 0.4 }
    houses: [{ house: the_fell, weight: 100 }]
