# CHARACTER TEMPLATES — the people the next thousand years produces.
#
# The seed cast is twelve individuals who exist in 1042. Everyone after them is
# minted from one of these recipes. A template is not a person: it says which
# house rolls the genome, what age they arrive at, what they are for, and how
# often the world makes one.
#
# `houses` is the field that matters. It decides whether this person carries
# anything, and the player has no way to see it — which is the entire reason
# the marriage market has a vocabulary and a forgery industry.
characterTemplates:
  # ── Suitors: the marriage market ────────────────────────────────────────
  - id: suitor_common_stock
    title: A Daughter of No Particular House
    role: suitor
    frequency: common
    weight: 140
    sex: female
    ageAtArrival: { min: 17, max: 26 }
    houses:
      - { house: house_calder, weight: 130 }
      - { house: commons, weight: 90 }
    blurb: >-
      Cheap, willing, and carrying nothing whatever. Her sons will be mundane
      and safe and useless, and the house will be one Regency closer.

  - id: suitor_of_ilm
    title: A Scholar's Daughter
    role: suitor
    frequency: uncommon
    weight: 110
    sex: female
    ageAtArrival: { min: 17, max: 28 }
    bias: { light: 0.5, mind: 0.5 }
    houses: [{ house: house_ilm, weight: 100 }]
    blurb: >-
      House Ilm keeps good records and better secrets. A two-percent chance of
      deep blood, and a certainty of being asked what you want it for.

  - id: suitor_of_deep_blood
    title: Deep Blood, and They Know It
    role: suitor
    frequency: rare
    weight: 100
    sex: female
    ageAtArrival: { min: 18, max: 24 }
    naming: of_house
    bias: { death: 0.6, charm: 0.6 }
    traits: [early_waking]
    houses: [{ house: house_marrow, weight: 100 }]
    conditions:
      all:
        - { respect: { op: gte, tier: regarded } }
    blurb: >-
      She woke at eleven in front of witnesses, which is the one thing in this
      market that cannot be forged. The price reflects it. So does the clause
      about her firstborn.

  - id: suitor_ruined_nobility
    title: Ruined, and Willing
    role: suitor
    frequency: uncommon
    weight: 120
    sex: female
    ageAtArrival: { min: 17, max: 30 }
    naming: of_house
    bias: { charm: 0.5 }
    houses:
      - { house: house_marrow, weight: 60 }
      - { house: house_ilm, weight: 100 }
    conditions:
      all:
        - { ageActive: the_insurrection }
    blurb: >-
      Six months ago her house would not have received your steward. Excellent
      blood, ruined standing, and terms that would be an insult in any other year.

  # ── Grooms: matrilineal matches ─────────────────────────────────────────
  - id: groom_who_marries_in
    title: A Man Who Will Take the Name
    role: groom
    frequency: common
    weight: 120
    sex: male
    ageAtArrival: { min: 19, max: 30 }
    houses:
      - { house: house_calder, weight: 140 }
      - { house: commons, weight: 70 }
      - { house: house_ilm, weight: 50 }
    blurb: >-
      A house whose living blood is all female must practise matrilineal
      marriage or end. Everyone finds it scandalous. Everyone would do it.

  - id: suitor_ward_of_the_church
    title: A Girl the Church Placed
    role: suitor
    frequency: common
    weight: 110
    sex: female
    ageAtArrival: { min: 17, max: 24 }
    bias: { light: 0.4 }
    houses:
      - { house: commons, weight: 120 }
      - { house: the_church, weight: 60 }
    blurb: >-
      Raised at the chapter house, dowered by the chapter house, and the
      chapter house would like to be told how she gets on. Every year. In
      writing.

  - id: suitor_widow_with_land
    title: A Widow, and Three Children Living
    role: suitor
    frequency: uncommon
    weight: 100
    sex: female
    ageAtArrival: { min: 26, max: 34 }
    bias: { fecundity: 0.6, mind: 0.3 }
    houses:
      - { house: house_calder, weight: 110 }
      - { house: commons, weight: 80 }
    blurb: >-
      She has buried a husband and borne three who lived, which is the only
      fact in this market that can be checked. Older than the others by ten
      years, and worth every one of them if what you want is a house full.

  - id: suitor_of_marrow_cousin
    title: A Cousin of the Rival
    role: suitor
    frequency: uncommon
    weight: 90
    sex: female
    naming: of_house
    ageAtArrival: { min: 17, max: 25 }
    bias: { death: 0.5, charm: 0.4 }
    houses: [{ house: house_marrow, weight: 100 }]
    blurb: >-
      Marrow does not send its daughters out for nothing, and this one comes
      with an understanding about the western pasture that nobody will write
      down. Her blood is better than her terms.

  # ── Grooms: matrilineal matches ─────────────────────────────────────────
  - id: groom_second_son
    title: A Second Son With Nothing Coming
    role: groom
    frequency: common
    weight: 130
    sex: male
    ageAtArrival: { min: 19, max: 28 }
    houses:
      - { house: house_calder, weight: 130 }
      - { house: commons, weight: 100 }
    blurb: >-
      His brother gets the land and he gets whatever he can arrange. He will
      take the name without an argument, which tells you exactly how little
      he was offered anywhere else.

  - id: groom_of_ilm_scholar
    title: A Man Who Reads
    role: groom
    frequency: uncommon
    weight: 100
    sex: male
    ageAtArrival: { min: 21, max: 32 }
    bias: { mind: 0.6, light: 0.4 }
    houses: [{ house: house_ilm, weight: 100 }]
    blurb: >-
      He has read more of the archive than your archivist has, and he asks
      about the east wing before he asks about the dowry. Useful, and the
      kind of useful that notices things.

  - id: groom_of_marrow_younger
    title: A Younger Son of Marrow
    role: groom
    frequency: uncommon
    weight: 80
    sex: male
    naming: of_house
    ageAtArrival: { min: 20, max: 30 }
    bias: { death: 0.5, strength: 0.3 }
    houses: [{ house: house_marrow, weight: 100 }]
    conditions:
      all:
        - { respect: { op: gte, tier: known } }
    blurb: >-
      Marrow offering a son to a house it has spent two generations calling
      inbred is not generosity. It is a man in your hall for forty years,
      and he will be a good husband while he is there.

  # ── The two houses the market could not reach ───────────────────────────
  # A house's gene pool only ever touches a person through a character
  # template: `mint` rolls the genome from the template's `houses` weights and
  # there is no other door. So `house_bracc` and `house_hesk` arrived as an
  # auction bidder and a paragraph respectively, and their blood — four hundred
  # years of counting, three hundred of marrying each other — reached nobody.
  # These four are that door.
  - id: suitor_of_bracc
    title: A Daughter of the Counting House
    role: suitor
    frequency: uncommon
    weight: 100
    sex: female
    naming: of_house
    ageAtArrival: { min: 18, max: 27 }
    bias: { mind: 0.7 }
    houses: [{ house: house_bracc, weight: 100 }]
    blurb: >-
      No font, no affinity, no signs, and a dowry that arrives as a letter of
      credit rather than as land. What she brings is a head for figures that
      breeds true and a family who will know this house's accounts by spring.

  - id: groom_of_bracc
    title: The Factor Who Married In
    role: groom
    frequency: uncommon
    weight: 90
    sex: male
    ageAtArrival: { min: 24, max: 38 }
    bias: { mind: 0.6, charm: 0.3 }
    houses: [{ house: house_bracc, weight: 100 }]
    blurb: >-
      He keeps the two per cent that every cross-border payment in this world
      loses, and he keeps it in the family now. Nobody in the province can
      decide whether the house has married up or been audited.

  - id: suitor_of_hesk
    title: The Quarry Match
    role: suitor
    frequency: common
    weight: 110
    sex: female
    ageAtArrival: { min: 16, max: 24 }
    bias: { strength: 0.6 }
    houses: [{ house: house_hesk, weight: 100 }]
    blurb: >-
      Eighteen miles north, strong as the wall she was raised behind, and the
      cheapest match on any card the house will ever be dealt. Three hundred
      years of marrying each other is in her at a load higher than any other
      pool in this game, and none of it is visible, and none of it is her fault.

  - id: groom_second_son_of_hesk
    title: A Second Son Out of Hesk
    role: groom
    frequency: common
    weight: 95
    sex: male
    ageAtArrival: { min: 20, max: 32 }
    bias: { strength: 0.5 }
    houses: [{ house: house_hesk, weight: 100 }]
    blurb: >-
      He can lift what two men lift and read what nobody needs read, and he
      will work a farm the way he worked a face of slate. What he carries is
      what she carries, and it is the same three hundred years.

