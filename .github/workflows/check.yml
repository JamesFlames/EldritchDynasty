name: check

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the whole thing by hand without an empty commit, which is the only
  # other way anybody has to ask CI a question twice.
  workflow_dispatch:

# Nothing here writes anything, so nothing here gets a token that can. This is
# explicit because the repository-wide default had to be raised to "read and
# write" for `janitor.yml` to delete a merged branch, and a default is exactly
# the kind of thing that widens a job nobody was thinking about at the time.
permissions:
  contents: read

# Supersede a PR's own earlier runs; never a push to `main`. Every commit on
# `main` is somebody's landed work and is the only verdict it will ever get —
# this repository fast-forwards without pull requests, so cancelling there
# would leave a commit permanently unjudged.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── WHY THREE JOBS AND NOT ONE ────────────────────────────────────────────
#
# This was one serial job. Measured on the runner, on 0ba760f, run 98:
#
#   npm ci 4s · typecheck 13s · validate 1s · test 13m13s · gates 8m38s
#   total 22m18s
#
# Those numbers are NEWER than the reason this was split, and they are the
# honest ones. While the repository was private the same job took 58-76
# minutes; it went public on 2026-09-06 and the very next run took 22. The
# work did not change, so something under it did — most likely the runner —
# and the wall-clock argument for splitting is correspondingly weaker than
# it looked. Recorded rather than quietly dropped, because a comment that
# keeps a number the runner has stopped producing is how this file would
# come to lie.
#
# THE REASON THAT SURVIVES THE FASTER RUNNER IS NOT THE CLOCK. A failing step
# aborts the steps after it, so a serial run reports the FIRST thing wrong
# and nothing else: fix a test, wait, discover a gate had moved too, fix
# that, wait again. The record of it is four pushes inside 33 minutes on
# 2026-09-05, spending hours of runner time to learn three facts one run
# could have carried.
#
# Split, every job reports independently — a broken typecheck no longer
# hides a moved gate — and the verdict arrives in the time the SLOWEST job
# takes rather than the sum of all of them. That holds at 22 minutes and it
# held at 64.
#
# NOTHING IS MOVED OFF `main`. The obvious version of this change — fast
# checks on push, the expensive ones on pull requests — would disable them:
# AGENTS.md records standing authorisation to fast-forward `main` with no PR
# at all, so a PR-gated job would run approximately never. Coverage on push
# is identical to what it was; only the shape changed.
#
# THE GATES ARE NOT SPLIT BY NAME, deliberately. `npm run gate` runs whatever
# is in `GATES`, so a new gate is in CI the moment it exists rather than the
# moment somebody remembers this file — gate 2 was written for CI and wired
# into nothing for its whole life under the old hand-kept list. Gates 4 and 8
# also share one 250-run batch between them; naming them into separate jobs
# would silently pay for it twice.
jobs:
  # Seconds, and it is the one that catches the failure this codebase calls
  # silent: a broken Vue template or a mismatched schema looks like a working
  # feature until somebody happens to hit the path.
  lint:
    name: typecheck + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # Zod validation across all content. Any error fails the build — this is
      # also where CI gate 6 (purposes) lives: `event/purposes` and
      # `event/purpose-overlap` are both error-level rules.
      - name: validate content
        run: npm run validate

      # Advice, not a gate — annotations, never a build failure. Runs even
      # when an earlier step failed, so a broken build still gets it.
      - name: prose lint (annotations only)
        if: always()
        run: npm run lint:prose

  # 13m13s on run 98. Both lanes: the fast suites and the `*.slow.test.ts`
  # ones that play whole games.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── THE RUN CORPUS ─────────────────────────────────────────────────
      #
      # `record.slow.test.ts` plays 240 runs of 458 years for two assertions
      # and, because vitest parallelises per FILE, was the 451-second floor
      # the whole lane waited behind. It reads those runs back through
      # saveGame/loadGame now — 23 seconds — but only once they are in the
      # corpus. COLD it is slightly slower than replaying (539s), because
      # playing a run and then saving and compressing it costs more than
      # playing it.
      #
      # So a cache that is never warm is a tax, and CI is exactly where it
      # would never be warm. The key is a hash of the simulation sources and
      # the content together, printed by the corpus tool itself: change
      # either and the key changes, the restore misses, and the warm step
      # below rebuilds it for next time. There is no invalidation to reason
      # about and no way to serve a run the current code would not produce.
      # Invoked through tsx rather than through an npm script, because
      # `land.test.ts` derives the landing's step set from this file by
      # matching npm invocations, and a quiet-mode flag in that position reads
      # to it as the name of a script. It matches comments too, on purpose, so
      # this one does not spell the flag out either. A workflow line that
      # confuses the thing checking the workflow is the workflow's to fix.
      - name: corpus key
        id: corpus
        run: |
          KEY=$(npx tsx --tsconfig tsconfig.base.json packages/core/src/tools/corpus-warm.ts --key)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: restore run corpus
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ed-runs
          key: ed-runs-${{ steps.corpus.outputs.key }}-${{ hashFiles('packages/content/**') }}
      # ADVISORY, and it says so to the runner as well as to `land.mjs`: the
      # corpus is a CACHE, and `playedRun` falls back to playing the run on any
      # failure to read or write one. A warm that fails costs the suite its
      # speed-up and cannot cost it its correctness, so it must not be able to
      # fail the build.
      - name: warm run corpus
        continue-on-error: true
        run: npm run corpus

      - name: test
        run: npm test

  # 8m38s on run 98, and the longest single thing after the tests. Gates 4
  # and 8 play 250 thousand-year runs between them, out of ONE shared batch —
  # which is why they are not named into separate jobs.
  #
  # gate 7 clauses · gate 4 fire rate · gate 2 slot fillability
  # gate 8 outcome reach · gate 6 purposes · gate 9 ladder scales · ladder
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gates
        run: npm run gate
