name: check

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything, so nothing here gets a token that can. This is
# explicit because the repository-wide default had to be raised to "read and
# write" for `janitor.yml` to delete a merged branch, and a default is exactly
# the kind of thing that widens a job nobody was thinking about at the time.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type errors are silent at runtime in this codebase's own words — a
      # broken template or a mismatched schema looks like a working feature
      # until someone happens to hit the path. Same gate `npm run check` runs
      # locally before any change is claimed to work.
      - name: typecheck
        run: npm run typecheck

      # Zod validation across all content. Any error fails the build — this
      # is also where CI gate 6 (purposes) lives: `event/purposes` and
      # `event/purpose-overlap` are both error-level rules.
      - name: validate content
        run: npm run validate

      # vitest on core and schema, fast and slow suites together.
      - name: test
        run: npm test

      # Every gate, in one command. This was four named steps and a list kept
      # by remembering — which is how gate 2 came to be written for CI and
      # wired into nothing, running nowhere for as long as it had existed.
      # `npm run gate` runs whatever is in `GATES`, so a new gate is in CI the
      # moment it exists rather than the moment somebody remembers this file.
      #
      # gate 7 clauses · gate 4 fire rate · gate 2 slot fillability
      # gate 8 outcome reach · gate 6 purposes
      - name: gates
        run: npm run gate

      # Prose lint is advice, not a gate — reported as annotations, never a
      # build failure. Runs even if an earlier step already failed, so a
      # broken build still gets the prose feedback.
      - name: prose lint (annotations only)
        if: always()
        run: npm run lint:prose
