name: janitor

# The sweep itself is `tools/janitor.sh`, because a script can be read and run
# and a YAML step cannot: `DRY_RUN=1 tools/janitor.sh` prints every action it
# would take against whatever remote you point it at, and performs none of them.
#
# It is a workflow at all only because agents physically cannot do this part —
# a Claude session's git proxy refuses ref deletion, 403, every time.

# DISABLED — the first real run deleted 29 branches it should have kept.
# `merge-base --is-ancestor` answered true for every branch on the runner while
# answering correctly in two local runs, so the automatic triggers are off until
# that is understood, reproduced and covered by a test. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: write   # delete merged branches and spent claim refs
  issues: write     # close an issue a landing commit named

concurrency:
  group: janitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ancestry is the whole test; a shallow clone cannot answer it

      - name: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          # Only a real push has a range to read closing keywords out of. A
          # first push, or a branch created, reports 000… for `before`, and the
          # script treats an unreadable range as "nothing was named".
          JANITOR_RANGE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || '' }}
        run: tools/janitor.sh
