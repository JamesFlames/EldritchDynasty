name: janitor

# WHAT AN AGENT CANNOT DO FOR ITSELF.
#
# A Claude session's git proxy refuses ref deletion — `git push --delete` comes
# back 403 — so no agent has ever been able to tidy up after itself. That is not
# a discipline problem and no amount of instruction fixes it: there are 34
# `claude/*` branches on this remote and six of them are merged work that has
# been sitting there since the day it landed.
#
# An Actions runner has none of that restriction. So the cleanup lives here,
# where it can actually happen, and it runs on the push that lands the work
# rather than on somebody remembering.
#
# It deletes ONLY what git can prove is redundant — a branch whose head is
# already an ancestor of `main`. A branch that is not merged is reported and
# left alone, because "abandoned" and "in flight" look identical from here and
# only one of them is safe to act on.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * *'   # 19:17 UTC — early morning in Auckland, either side of
                            # daylight saving. For claims whose session died quietly.
  workflow_dispatch:

permissions:
  contents: write   # delete merged branches and retired claim refs
  issues: write     # close an issue whose landing commit named it

concurrency:
  group: janitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ancestry is the whole test; a shallow clone cannot answer it

      - name: delete branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "### Branches" >> "$GITHUB_STEP_SUMMARY"
          deleted=0 kept=0
          while read -r sha ref; do
            branch=${ref#refs/heads/}
            case "$branch" in main|claim/*) continue;; esac
            if git merge-base --is-ancestor "$sha" origin/main; then
              git push origin --delete "$branch" && deleted=$((deleted+1))
              echo "- deleted \`$branch\` — merged" >> "$GITHUB_STEP_SUMMARY"
            else
              kept=$((kept+1))
              days=$(( ( $(date +%s) - $(git log -1 --format=%ct "$sha") ) / 86400 ))
              # Not merged. It may be work in flight, or it may be a session that
              # died in 2026. This job cannot tell the difference, so it says so
              # and touches nothing.
              [ "$days" -ge 14 ] && echo "- kept \`$branch\` — NOT merged, last commit ${days}d ago" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(git ls-remote --heads origin | sed 's/\t/ /')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$deleted deleted, $kept left standing." >> "$GITHUB_STEP_SUMMARY"

      - name: retire the claims whose work has landed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "### Claims" >> "$GITHUB_STEP_SUMMARY"
          # A claim ref is `claim/<issue>` — see docs/PARALLEL.md and tools/agents.mjs.
          # It is retired when its issue is closed (GitHub does that itself, off the
          # closing keyword in the landing commit) or when the agent released it.
          while read -r sha ref; do
            slug=${ref#refs/heads/claim/}
            git fetch -q origin "$ref:refs/claim-read/$slug" --force
            body=$(git log -1 --format=%B "refs/claim-read/$slug")
            released=$(grep -c '^released:' <<<"$body" || true)
            gone=0
            if [ "$released" -gt 0 ]; then
              gone=1; why="released by the agent"
            elif [[ "$slug" =~ ^[0-9]+$ ]]; then
              state=$(gh issue view "$slug" --json state --jq .state 2>/dev/null || echo UNKNOWN)
              if [ "$state" = "CLOSED" ]; then gone=1; why="issue #$slug is closed"; fi
            fi
            if [ "$gone" = 1 ]; then
              git push origin --delete "${ref#refs/heads/}"
              echo "- retired \`claim/$slug\` — $why" >> "$GITHUB_STEP_SUMMARY"
            else
              age=$(( ( $(date +%s) - $(git log -1 --format=%ct "refs/claim-read/$slug") ) / 3600 ))
              holder=$(sed -n 's/^agent: //p' <<<"$body" | head -1)
              echo "- \`claim/$slug\` still held by ${holder:-someone}, ${age}h" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(git ls-remote origin 'refs/heads/claim/*' | sed 's/\t/ /')

      - name: close the issues this push says it finished
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub closes an issue off a closing keyword in a commit that reaches
          # the default branch, and does it faster than this job runs. This step
          # is the backstop for the shapes it does not honour — a keyword in a
          # merge commit's body, or a run where the push event arrived first —
          # and it is a no-op whenever the platform already did the work.
          range="${{ github.event.before }}..${{ github.sha }}"
          git rev-list --no-merges "$range" 2>/dev/null | while read -r c; do
            git log -1 --format=%B "$c"
          done | grep -oiE '(clos(e|es|ed)|fix(e[sd])?|resolv(e|es|ed)) +#[0-9]+' | grep -oE '[0-9]+' | sort -u | while read -r n; do
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --reason completed --comment "Landed on \`main\` in ${{ github.sha }}."
              echo "- closed #$n" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
