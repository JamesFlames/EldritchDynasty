name: issue-133-baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 400-year deterministic digest
        run: npm run digest -- 8 400
      - name: first 500 years of the current 1000-year game
        run: npm run harness -- 24 500

  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: blood at 500 years
        run: npm run gate:blood -- 12 500
      - name: ladder at 500 years
        run: npm run gate:ladder -- 12 500
      - name: endings diagnostic at 500 years
        run: npm run gate:endings -- 24 500

  accumulated-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: land at 500 years
        run: npm run gate:land -- 12 500
      - name: muster at 500 years
        run: npm run gate:war -- 24 500
