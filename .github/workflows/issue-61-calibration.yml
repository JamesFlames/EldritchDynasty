name: issue-61-calibration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ladder channel — 40 x 500
        run: npm run gate:ladder -- 40 500
      # Blood F1 already completed on the previous calibration:
      # concentrate 16.3→16.4, dilute 16.2→16.6, chronicler 15.6→16.5.
      # Do not spend another 120 full runs repeating it.
