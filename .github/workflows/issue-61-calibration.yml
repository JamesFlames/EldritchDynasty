name: issue-61-calibration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reach-sweep:
    strategy:
      fail-fast: false
      matrix:
        reach: [4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: set Great Rite reach
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("packages/core/src/events/rites.ts")
          s = p.read_text()
          old = "export const GREAT_RITE_REACH = 4;"
          new = "export const GREAT_RITE_REACH = ${{ matrix.reach }};"
          if old not in s:
              raise SystemExit("GREAT_RITE_REACH anchor missing")
          p.write_text(s.replace(old, new))
          PY
      - name: ladder — 40 x 500
        run: npm run gate:ladder -- 40 500
      - name: endings direction — 20 x 500 per policy
        run: npm run gate:endings -- 20 500
