name: issue-133-stage5-calibration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  long-line:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: typecheck core
        run: npm run typecheck:core
      - name: Stage 5A-E — 40 x 500
        run: npm run gate:long -- 40 500

  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Land — 20 x 500
        run: npm run gate:land -- 20 500

  muster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Muster — 80 x 500
        run: npm run gate:war -- 80 500
