name: bearing-36-variance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  god-book-diagnostic:
    name: diagnose ascendant God read-back
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Measurement-only instrumentation. Keep the branch's Long=9 read-back:
      # reproduce the red endings batch and print the book carried by any
      # ascendant run that actually reaches/attests God.
      - name: Instrument the God-reaching run
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/core/src/tools/ending-gate.ts")
          source = path.read_text()
          marker = "  const r = readTheChronicle(ctx);\n  const bottleneckDecisions = w.decisionLog.filter((d) => d.kind === 'outcome'"
          insertion = """  const r = readTheChronicle(ctx);
            if (policy === 'ascendant' && (r.attested === 'god' || w.ascension.best === 'god')) {
              const open = [...w.discrepancies.entries()].filter(([, d]) => d.state === 'open');
              console.log('[bearing-36-god-book] ' + JSON.stringify({
                seed,
                ending: w.ending?.id ?? null,
                worldBest: w.ascension.best,
                attested: r.attested,
                substantiated: r.substantiated,
                unsupportable: r.unsupportable,
                rungsWithheld: r.rungsWithheld,
                open,
              }));
            }
            const bottleneckDecisions = w.decisionLog.filter((d) => d.kind === 'outcome'"""
          # YAML removes the block indentation from the triple-quoted body.
          # Put back the two TS spaces stripped from continuation lines.
          insertion = insertion.replace("\n  ", "\n  ")
          if marker not in source:
              raise SystemExit("ending-gate.ts diagnostic insertion point moved")
          path.write_text(source.replace(marker, insertion, 1))
          PY

      - name: Reproduce endings with telemetry
        run: npm run gates -- --lane endings || true
