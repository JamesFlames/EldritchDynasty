name: bearing-36-variance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  endings-candidate:
    name: endings — record-only excess boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply measurement-only record-readback candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/core/src/ending.ts")
          source = path.read_text()

          old_loop = """  let provenLies = 0;
            let standingLies = 0;
            let unsupportable = 0;
            for (const d of w.discrepancies.values()) {
              if (d.state === 'proven') provenLies += 1;
              else if (d.state === 'open') {
                standingLies += 1;
                unsupportable += SEVERITY_WEIGHT[d.severity] ?? SEVERITY_WEIGHT['minor']!;
              }
            }"""
          new_loop = """  const recordDiscrepancies = new Set(
              w.chronicle
                .filter((entry) => entry.record === 'embellish' && entry.discrepancyId !== undefined)
                .map((entry) => entry.discrepancyId!),
            );
            let provenLies = 0;
            let standingLies = 0;
            let unsupportable = 0;
            for (const [id, d] of w.discrepancies) {
              if (d.state === 'proven') provenLies += 1;
              else if (d.state === 'open') {
                standingLies += 1;
                if (recordDiscrepancies.has(id)) {
                  unsupportable += SEVERITY_WEIGHT[d.severity] ?? SEVERITY_WEIGHT['minor']!;
                }
              }
            }"""
          if old_loop not in source:
              raise SystemExit("ending.ts discrepancy loop moved")
          source = source.replace(old_loop, new_loop, 1)

          old_bill = "  const rungsWithheld = Math.floor(unsupportable / unsupportablePerRung(ctx));"
          new_bill = "  const rungsWithheld = Math.floor(Math.max(0, unsupportable - 1) / unsupportablePerRung(ctx));"
          if old_bill not in source:
              raise SystemExit("ending.ts read-back bill moved")
          source = source.replace(old_bill, new_bill, 1)

          path.write_text(source)
          PY
      - name: Measure existing ending distribution
        run: npm run gates -- --lane endings

  bearing-candidate:
    name: bearing ${{ matrix.years }}y record-only excess (${{ matrix.base }} + ${{ matrix.step }}i)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - years: 300
            base: 4000
            step: 13
          - years: 300
            base: 9001
            step: 17
          - years: 300
            base: 20011
            step: 29
          - years: 300
            base: 31013
            step: 37
          - years: 500
            base: 4000
            step: 13
          - years: 500
            base: 9001
            step: 17
          - years: 500
            base: 20011
            step: 29
          - years: 500
            base: 31013
            step: 37

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply measurement-only record-readback candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/core/src/ending.ts")
          source = path.read_text()

          old_loop = """  let provenLies = 0;
            let standingLies = 0;
            let unsupportable = 0;
            for (const d of w.discrepancies.values()) {
              if (d.state === 'proven') provenLies += 1;
              else if (d.state === 'open') {
                standingLies += 1;
                unsupportable += SEVERITY_WEIGHT[d.severity] ?? SEVERITY_WEIGHT['minor']!;
              }
            }"""
          new_loop = """  const recordDiscrepancies = new Set(
              w.chronicle
                .filter((entry) => entry.record === 'embellish' && entry.discrepancyId !== undefined)
                .map((entry) => entry.discrepancyId!),
            );
            let provenLies = 0;
            let standingLies = 0;
            let unsupportable = 0;
            for (const [id, d] of w.discrepancies) {
              if (d.state === 'proven') provenLies += 1;
              else if (d.state === 'open') {
                standingLies += 1;
                if (recordDiscrepancies.has(id)) {
                  unsupportable += SEVERITY_WEIGHT[d.severity] ?? SEVERITY_WEIGHT['minor']!;
                }
              }
            }"""
          if old_loop not in source:
              raise SystemExit("ending.ts discrepancy loop moved")
          source = source.replace(old_loop, new_loop, 1)

          old_bill = "  const rungsWithheld = Math.floor(unsupportable / unsupportablePerRung(ctx));"
          new_bill = "  const rungsWithheld = Math.floor(Math.max(0, unsupportable - 1) / unsupportablePerRung(ctx));"
          if old_bill not in source:
              raise SystemExit("ending.ts read-back bill moved")
          source = source.replace(old_bill, new_bill, 1)

          path.write_text(source)
          PY
      - name: Measure Bearing
        run: npm run gate:bearing -- 80 ${{ matrix.years }} ${{ matrix.base }} ${{ matrix.step }}
