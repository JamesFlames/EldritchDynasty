name: bearing-36-variance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  bearing-long-12:
    name: bearing 500y threshold 12 (${{ matrix.base }} + ${{ matrix.step }}i)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: 4000
            step: 13
          - base: 9001
            step: 17
          - base: 20011
            step: 29
          - base: 31013
            step: 37

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Measurement-only patch. Threshold 12 is the first completed candidate
      # from the endings sweep that restores the intentional ascendant God
      # payoff while keeping the ordinary ending distribution judgeable.
      - name: Set Long-Line threshold 12
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/core/src/ending.ts")
          source = path.read_text()
          needle = """function unsupportablePerRung(ctx: SimCtx): number {
            const years = campaignDef(ctx.world.campaign).years;
            return Math.max(1, Math.round(UNSUPPORTABLE_PER_RUNG * years / UNSUPPORTABLE_REFERENCE_YEARS));
          }"""
          replacement = """function unsupportablePerRung(ctx: SimCtx): number {
            if (ctx.world.campaign === 'long') return 12;
            const years = campaignDef(ctx.world.campaign).years;
            return Math.max(1, Math.round(UNSUPPORTABLE_PER_RUNG * years / UNSUPPORTABLE_REFERENCE_YEARS));
          }"""
          if needle not in source:
              raise SystemExit("ending.ts threshold function no longer matches the measurement patch")
          path.write_text(source.replace(needle, replacement))
          PY

      - name: Measure Bearing at Long-Line threshold 12
        run: npm run gate:bearing -- 80 500 ${{ matrix.base }} ${{ matrix.step }}
