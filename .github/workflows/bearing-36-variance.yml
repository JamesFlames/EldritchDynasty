name: bearing-36-variance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  god-book-diagnostic:
    name: diagnose ascendant God seed 5121
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Instrument the God-reaching run
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/core/src/tools/ending-gate.ts")
          source = path.read_text()
          marker = "  const r = readTheChronicle(ctx);\n  const bottleneckDecisions = w.decisionLog.filter((d) => d.kind === 'outcome'"
          insertion = """  const r = readTheChronicle(ctx);
            if (policy === 'ascendant' && (r.attested === 'god' || w.ascension.best === 'god')) {
              const open = [...w.discrepancies.entries()].filter(([, d]) => d.state === 'open');
              const linked = new Set(
                w.chronicle.filter((e) => e.discrepancyId).map((e) => e.discrepancyId),
              );
              console.log('[bearing-36-god-book] ' + JSON.stringify({
                seed,
                ending: w.ending?.id ?? null,
                worldBest: w.ascension.best,
                attested: r.attested,
                substantiated: r.substantiated,
                unsupportable: r.unsupportable,
                rungsWithheld: r.rungsWithheld,
                open: open.map(([id, d]) => ({ id, ...d, fromEmbellish: linked.has(id) })),
              }));
            }
            const bottleneckDecisions = w.decisionLog.filter((d) => d.kind === 'outcome'"""
          if marker not in source:
              raise SystemExit("ending-gate.ts diagnostic insertion point moved")
          path.write_text(source.replace(marker, insertion, 1))
          PY

      - name: Play the current intentional-God seed
        run: |
          npx tsx -e "import { loadContent } from '@ed/content'; import { playToTheEnd } from './packages/core/src/tools/ending-gate.ts'; console.log(JSON.stringify(playToTheEnd(loadContent(), 5121, 500, 'ascendant', 'long')));"
